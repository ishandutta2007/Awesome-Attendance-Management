<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="text-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes checkPop {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }

      .animated-float-1 { animation: floatSlow 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .animated-float-2 { animation: floatFast 5s ease-in-out infinite 1s; transform-box: fill-box; transform-origin: center; }
      .animated-pulse { animation: pulseGlow 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .animated-dash { stroke-dasharray: 8, 8; animation: dashFlow 20s linear infinite; }
      .animated-check { animation: checkPop 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.12">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" stroke="#94a3b8" stroke-width="1" />
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Ambient Pulsing Glow Backgrounds -->
  <circle cx="200" cy="160" r="220" fill="url(#glow)" class="animated-pulse" />
  <circle cx="1000" cy="160" r="250" fill="url(#glow)" class="animated-pulse" style="animation-delay: 2s;" />

  <!-- Animated Connection Flows (Background Layer) -->
  <path d="M150 250 Q 350 290 600 240 T 1050 220" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4" class="animated-dash" />
  <path d="M100 80 Q 450 30 750 90 T 1120 70" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.3" class="animated-dash" style="animation-duration: 15s;" />

  <!-- Floating Dynamic UI Elements (Background Elements - Left Side) -->
  <g class="animated-float-1" filter="url(#shadow)">
    <rect x="60" y="55" width="170" height="42" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="82" cy="76" r="10" fill="#10b981" class="animated-check" />
    <path d="M77 76 L81 80 L88 72" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="100" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Present: 98.4%</text>
  </g>

  <g class="animated-float-2" filter="url(#shadow)">
    <rect x="80" y="215" width="160" height="42" rx="10" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="94" y="228" width="16" height="16" rx="4" fill="#6366f1" />
    <text x="102" y="240" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff">AI</text>
    <text x="118" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Face Biometrics</text>
  </g>

  <!-- Floating Dynamic UI Elements (Background Elements - Right Side) -->
  <g class="animated-float-2" filter="url(#shadow)">
    <rect x="960" y="60" width="180" height="44" rx="10" fill="url(#card-grad)" stroke="#f472b6" stroke-width="1.5" />
    <circle cx="982" cy="82" r="10" fill="#ec4899" />
    <text x="978" y="86" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">QR</text>
    <text x="1000" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Dynamic Scanner</text>
  </g>

  <g class="animated-float-1" filter="url(#shadow)">
    <rect x="970" y="210" width="170" height="44" rx="10" fill="url(#card-grad)" stroke="#34d399" stroke-width="1.5" />
    <circle cx="992" cy="232" r="10" fill="#10b981" />
    <path d="M988 232 L991 235 L996 229" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="1010" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Offline Sync</text>
  </g>

  <!-- Center Decorative Glow Line -->
  <rect x="300" y="42" width="600" height="2" fill="url(#accent-grad)" rx="1" />

  <!-- MAIN FOREGROUND CONTENT (Guaranteed Unobscured Top Layer) -->
  <!-- Header Icon Badge -->
  <g filter="url(#shadow)">
    <rect x="575" y="60" width="50" height="50" rx="14" fill="url(#accent-grad)" />
    <!-- Calendar/Attendance Icon -->
    <path d="M590 77 H610 M590 84 H610 M590 91 H604 M595 72 V75 M605 72 V75" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="607" cy="91" r="3" fill="#34d399" />
  </g>

  <!-- Main Title -->
  <text x="600" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Awesome Attendance Management
  </text>

  <!-- Gradient Subtitle Bar -->
  <text x="600" y="192" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    Curated SaaS Platforms • Open-Source SIS • Biometrics &amp; Facial Recognition Systems
  </text>

  <!-- Decorative Footer Pills inside Banner -->
  <g filter="url(#shadow)">
    <!-- Pill 1 -->
    <rect x="360" y="222" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="430" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🎓 K-12 &amp; Higher Ed</text>

    <!-- Pill 2 -->
    <rect x="515" y="222" width="170" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#a78bfa">⚡ Real-time Analytics</text>

    <!-- Pill 3 -->
    <rect x="700" y="222" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="770" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#f472b6">🔒 Truancy Alerts</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="350" y="275" width="500" height="3" fill="url(#accent-grad)" rx="1.5" />
</svg>
